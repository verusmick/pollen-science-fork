<div class="rule-item mb-4 p-4 border rounded bg-white">
  <div class="d-flex align-items-start">
    <!-- Toggle Switch -->
    <div class="mr-3">
      <div class="btn-group btn-group-toggle" data-toggle="buttons">
        <label
          class="btn btn-sm"
          :class="isActive ? 'btn-primary active' : 'btn-outline-secondary'"
          @click="toggleActive(true)"
        >
          <input type="radio" :checked="isActive" autocomplete="off" /> On
        </label>
        <label
          class="btn btn-sm"
          :class="!isActive ? 'btn-primary active' : 'btn-outline-secondary'"
          @click="toggleActive(false)"
        >
          <input type="radio" :checked="!isActive" autocomplete="off" /> Off
        </label>
      </div>
    </div>

    <!-- Rule Content -->
    <div class="flex-grow-1">
      <h5 class="rule-title mb-2 text-dark">{{ rule.title }}</h5>
      <p class="rule-description mb-3 text-muted">{{ rule.description }}</p>

      <!-- Tags -->
      <div class="rule-tags mb-2">
        <!-- Primary Tag -->
        <span
          class="badge mr-2"
          :class="`badge-${getTagColor(rule.pollenType)}`"
        >
          {{ rule.pollenType }}
        </span>

        <!-- Action Type -->
        <span v-if="rule.actionType" class="badge badge-warning mr-2">
          {{ rule.actionType }}
        </span>

        <!-- Stations -->
        <span
          v-for="station in rule.stations"
          :key="station"
          class="badge badge-secondary mr-2"
        >
          {{ station }}
        </span>
      </div>

      <!-- Season -->
      <div class="rule-season text-muted">
        <small>
          <i class="far fa-calendar-alt mr-1"></i>
          <strong>Season:</strong> {{ rule.seasonStart }} - {{ rule.seasonEnd }}
        </small>
      </div>
    </div>

    <!-- Edit Button -->
    <div class="ml-3">
      <button
        class="btn btn-sm btn-outline-secondary"
        @click="$emit('edit', rule)"
        title="Edit rule"
      >
        <i class="fas fa-pencil-alt"></i>
      </button>
    </div>
  </div>
</div>
