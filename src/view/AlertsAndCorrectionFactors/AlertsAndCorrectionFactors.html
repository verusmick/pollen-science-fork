<page-layout :use-container="false">
  <div class="container-fluid mt-3">
    <!-- Tabs -->
    <ul class="nav nav-tabs mb-3">
      <li class="nav-item">
        <a
          class="nav-link"
          :class="{ active: activeTab === 'alerts' }"
          @click="setActiveTab('alerts')"
          href="#"
        >
          Alerts
        </a>
      </li>
      <li class="nav-item">
        <a
          class="nav-link"
          :class="{ active: activeTab === 'correctionFactors' }"
          @click="setActiveTab('correctionFactors')"
          href="#"
        >
          Correction Factors
        </a>
      </li>
    </ul>

    <!-- Tab Content -->
    <div class="tab-content">
      <!-- Alerts Tab -->
      <div
        v-show="activeTab === 'alerts'"
        class="tab-pane fade"
        :class="{ 'show active': activeTab === 'alerts' }"
      >
        <AlertsList />
      </div>

      <!-- Correction Factors Tab -->
      <div
        v-show="activeTab === 'correctionFactors'"
        class="tab-pane fade"
        :class="{ 'show active': activeTab === 'correctionFactors' }"
      >
        <CorrectionFactorsList />
      </div>
    </div>
  </div>
</page-layout>
